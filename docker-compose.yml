version: '3.8'

services:
  app:
    build: .
    container_name: projectx-app
    working_dir: /var/www/projectx
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=projectx
      - DB_USERNAME=projectx_user
      - DB_PASSWORD=Hello2026!!!
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./:/var/www/projectx
      - ./storage:/var/www/projectx/storage
    ports:
      - "9000:9000"
    depends_on:
      - db
      - redis
    networks:
      - projectx-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: projectx-db
    environment:
      MYSQL_DATABASE: projectx
      MYSQL_USER: projectx_user
      MYSQL_PASSWORD: Hello2026!!!
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - projectx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  nginx:
    image: nginx:latest
    container_name: projectx-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/projectx
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - projectx-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: projectx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - projectx-network
    restart: unless-stopped

volumes:
  db_data:
  redis_data:

networks:
  projectx-network:
    driver: bridge
